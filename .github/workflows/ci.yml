name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    # §3 matrix leg: the suite must hold across the supported OS/Python
    # surface, not just the development host.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        # macos-13 (Intel) runners are retired — they queue indefinitely and
        # never schedule. macOS x86_64 remains an ops-side leg outside CI.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --group dev --python ${{ matrix.python }}
      # Release-tree integrity: the manifest must match the committed files —
      # a stale MANIFEST.sha256 is itself a failure, so verify before building.
      - run: uv run python scripts/update_manifest.py --check
      - run: uv run ruff check .
      - run: uv run pytest -q
      # §53/§22 bounded adversarial legs — continuous, not just historical
      # evidence. Browser-free, so the whole OS×Python matrix exercises them.
      - run: uv run python scripts/fuzz_check.py --cases 20000
      - run: uv run python scripts/crash_check.py --iterations 3 --writers 2
      # §61: key-compromise/rotation drill — sub-second, browser-free, so the
      # new-epoch semantics gate every push on every matrix leg.
      - run: uv run python scripts/keydrill_check.py
      - run: node --check jev_ultrafast/snapshot.js
      - run: node --check jev_ultrafast/static/app.js
      - run: uv build

  mutation-gate:
    # §55/§63 continuous gate: the curated TCB mutant sweep must stay 12/12
    # killed — every fail-closed check keeps its detecting test on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/mutate_check.py

  live-guards:
    # Real-browser execution-guard regressions. v0.4.0 shipped a mutation bug
    # that passed mocked tests and broke only in Chrome; this job gates that
    # class of regression with no model calls and no external websites.
    # §3 axis: run the same suite on the runner's current stable AND a pinned
    # previous major — CDP/atomic-mutation behavior must not be version-locked.
    strategy:
      fail-fast: false
      matrix:
        chrome: ["runner", "140"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Install pinned Chrome
        if: matrix.chrome != 'runner'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ matrix.chrome }}
          install-dependencies: true
      - name: Launch headless Chrome with CDP
        env:
          CHROME_BIN: ${{ matrix.chrome == 'runner' && 'google-chrome' || steps.chrome.outputs.chrome-path }}
        run: |
          "$CHROME_BIN" --headless=new --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/jev-guard-chrome" --no-first-run \
            --no-sandbox --disable-gpu about:blank &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: BU_CDP_URL=http://127.0.0.1:9222 uv run python scripts/check_guards.py
      # §46/§47 leg: the full loop end-to-end on the same Chrome — scripted
      # backend, real evidence store, decide-time fault injection.
      - run: BU_CDP_URL=http://127.0.0.1:9222 uv run python scripts/e2e_check.py
      # §12/§44 bounded slice: the race + TOCTOU churn probes run on the job's
      # real Chrome so interruption-safety regressions gate every push.
      - run: BU_CDP_URL=http://127.0.0.1:9222 uv run python scripts/race_check.py --nav-iterations 50 --churn-iterations 100
