[project]
name = "jev-ultrafast"
version = "0.9.1"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "cryptography>=43,<46",
    "httpx[http2]>=0.28,<1",
]

[project.scripts]
jev = "jev_ultrafast.demo:main"
jev-dream = "jev_ultrafast.dream_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
    "pillow>=11,<13",
    "hypothesis>=6.140,<7",
    "pytest-cov>=6,<8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mutmut]
# §55 full-tool mutation pass configuration (mutmut 3.x). Scoped runs:
#   uv run --with mutmut mutmut run                     # whole package (long)
#   uv run --with mutmut mutmut run --mutate signing.py # per docs/3.x CLI
source_paths = ["jev_ultrafast/"]
pytest_add_cli_args = ["--no-cov", "-x", "-q"]
pytest_add_cli_args_test_selection = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# §56 coverage floor: the offline suite holds ~86% (browser.py is exercised by
# the live Chrome guards, demo.py by the CLI smoke). 80% is the committed gate.
addopts = "--cov=jev_ultrafast --cov-report=term-missing --cov-fail-under=80"
